<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Exploring HTML forms</title>
</head>

<body>
  <form action = "http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php" method="post">
  <h1>Volunteer Form</h1>

  <fieldset>
    <legend>My Info</legend>

    <!--First Name-->
      <div>
        <label for="firstName">first name:</label>
        <input type="text" id="fname" name="first_name_field" required size="100">
      
      </div>

    <!--Last Name-->
      <div>
        <label for="lastName">last name:</label>
        <input type="text" id="lname" name="last_name_field" required size = "100">
      </div>

    <!--Phone Number-->
      <div>
        <label for="phone">phone:</label>
        <input type="tel" id="phone" name="phone_field" size = "100">
      </div>
    
    <!--Email-->
      <div>
        <label for="email">email:</label>
        <input type="email" id="email" name="email_field" size = "100">
      </div>
      
    <!--Gender-->  
      <div>
        Gender:<br>
          <input type="radio" name="gender_field" value="Male">
          <label for="Male">Male</label>

          <input type="radio" name="gender_field" value="Female">
          <label for="Female">Female</label>

      </div>

    <!--Age-->
      <div>
        <label for="age">age:</label><br>
        <select id="age" name="age_field">

          <option value="under18">under 18</option>
          <option value="over18">over 18</option>

        </select>
      </div>

    </fieldset>

  <fieldset>
    <legend>My Availability</legend>
      <div>
        <!--For the Days Available-->
        <h2>Days Available:</h2>
          <label>Sunday <input type="checkbox" id="sunday" name="available_field[]" value="Sunday"></label><br>
          <label>Monday <input type="checkbox" id="monday" name="available_field[]" value="Monday"></label><br>
          <label>Tuesday <input type="checkbox" id="tuesday" name="available_field[]" value="Tuesday"></label><br>
          <label>Wednesday <input type="checkbox" id="wednesday" name="available_field[]" value="Wednesday"></label><br>
          <label>Thursday <input type="checkbox" id="thursday" name="available_field[]" value="Thursday"></label><br>
          <label>Friday <input type="checkbox" id="friday" name="available_field[]" value="Friday"></label><br>
          <label>Saturday <input type="checkbox" id="saturday" name="available_field[]" value="Saturday"></label><br>
      </div>

      <div>
        <h2>Comments</h2>
         <textarea id="commentbox" name="comments_field" rows="2" cols="10"></textarea>
      </div>

    </fieldset>

  
    <input type="hidden" name="hidden_field" value="JohnDLopez">
  </form>


  <input type="submit" value="Submit Query" >

</body>


</html>

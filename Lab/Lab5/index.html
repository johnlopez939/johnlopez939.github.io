<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Exploring HTML forms</title>
  <html lang="en">
</head>
<body>
  <form action = "http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php"
method="post">
  <h1>Volunteer Form</h1>

  <fieldset>
    <legend>My Info</legend>
      <div>
        <!--First Name-->
        <label for="firstName">first name:</label>
        <input type="text" id="fname" name="first_name_field" required size="100"/>
      
      </div>

      <div>
        <!--Last Name-->
        <label for="lastName">last name:</label>
        <input type="text" id="lname" name="last_name_field" required/>
      </div>

      <div>
        <!--Phone Number-->
        <label for="phone">phone:</label>
        <input type="tel" id="phone" name="phone_field" required/>
      </div>

      <div>
        <!--Email-->
        <label for="email">email:</label>
        <input type="email" id="email" name="email_field"/>
      </div>
      
      <div>
        <!--Gender-->
        <p>Gender:</p>
        <input type="radio" id="Male" name="gender" value="Male">
        <label for="Male">Male</label>

        <input type="radio" id="Female" name="gender" value="Female">
        <label for="Female">Female</label>

      </div>

      <div>
        <!--Age-->
        <label for="age">age:</label>
        <select id="age" name="age_field">
          <option value="under18">under 18</option>
          <option value="over18">over 18</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>My Availability</legend>
      <!--For the Days Available-->
        <h3>Days Available:</h3>
          <input type="checkbox" id="available_field[]" name="Sunday">
          <label for="available_field[]">Sunday</label><br>
          
          <input type="checkbox" id="available_field[]" name="Sunday">
          <label for="available_field[]">Sunday</label><br>
          
          <input type="checkbox" id="available_field[]" name="Monday">
          <label for="available_field[]">Monday</label><br>
          
          <input type="checkbox" id="available_field[]" name="Tuesday">
          <label for="available_field[]">Tuesday</label><br>
          
          <input type="checkbox" id="available_field[]" name="Wednesday">
          <label for="available_field[]">Wednesday</label><br>
          
          <input type="checkbox" id="available_field[]" name="Thursday">
          <label for="available_field[]">Thursday</label><br>
          
          <input type="checkbox" id="available_field[]" name="Friday">
          <label for="available_field[]">Friday</label><br>
          
          <input type="checkbox" id="available_field[]" name="Saturday">
          <label for="available_field[]">Saturday</label><br>

        <h3>Comments</h3>
         <textarea id="commentbox" name="comments" rows="4" cols="50"></textarea>

        </fieldset>

  

  </form>


  <input type="submit" value="Submit Query" />

</body>


</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Exploring HTML forms</title>
</head>
<body>
  <form action = ="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php"
method="post">
  <h1>Volunteer Form</h1>

  <fieldset>
    <legend>My Info</legend>
      <div>
        <!--First Name-->
        <label for="firstName">first name:</label>
        <input type="text" id="fname" name="first_name_field" required/>
      
      </div>

      <div>
        <!--Last Name-->
        <label for="lastName">last name:</label>
        <input type="text" id="lname" name="last_name_field" required/>
      </div>

      <div>
        <!--Phone Number-->
        <label for="phone">phone:</label>
        <input type="tel" id="phone" name="phone_field" required/>
      </div>

      <div>
        <!--Email-->
        <label for="email">email:</label>
        <input type="email" id="email" name="email_field"/>
      </div>
      
      <div>
        <!--Gender-->
        <p>Gender:</p>
        <input type="radio" id="Male" name="gender" value="Male">
        <label for="Male">Male</label>

        <input type="radio" id="Female" name="gender" value="Female">
        <label for="Female">Female</label>

      </div>

      <div>
        <!--Age-->
        <label for="age">age:</label>
        <select id="age" name="age_field">
          <option value="under18">under 18</option>
          <option value="over18">over 18</option>
        </select>
      </div>
  </fieldset>

  

  </form>


<input type="submit" value="Submit Query" />

</body>


</html>
